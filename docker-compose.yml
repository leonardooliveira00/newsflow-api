services:
  api:
    build:
      context: .
      dockerfile: dockerfile.dev

    container_name: newsflow-api

    restart: unless-stopped

    ports:
      - '3000:8080'

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: true
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=newsflow;Username=newsflow;Password=newsflow

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - .:/app
      - dotnet_bin:/app/bin
      - dotnet_obj:/app/obj

  postgres:
    image: postgres:18

    container_name: newsflow-postgres

    restart: unless-stopped

    ports:
      - '5432:5432'

    environment:
      POSTGRES_USER: newsflow
      POSTGRES_PASSWORD: newsflow
      POSTGRES_DB: newsflow

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U newsflow -d newsflow']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine

    container_name: newsflow-redis

    restart: unless-stopped

    ports:
      - '6379:6379' 

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  dotnet_bin:
  dotnet_obj: